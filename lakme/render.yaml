services:
  - type: web
    name: lakme-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install && npm run build || true"
    startCommand: "cd backend && npm install && npm start"
    envVars:
      - key: MONGO_URI
      - key: JWT_SECRET
      - key: RECAPTCHA_SECRET
      - key: NODE_ENV

  - type: static
    name: lakme-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/build"
    envVars:
      - key: REACT_APP_API_URL
      - key: REACT_APP_RECAPTCHA_SITE_KEY
